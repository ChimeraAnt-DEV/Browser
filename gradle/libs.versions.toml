# Bastion version catalog.
# All versions are pinned to releases that exist on their repositories as of the
# 2026-11-02 verification pass (fetched via maven-metadata.xml).

[versions]
agp = "9.5.0"
kotlin = "2.4.21"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
navigationCompose = "2.10.2"
datastore = "1.3.0"
paletteKtx = "1.1.0"
biometric = "1.1.0"
haze = "1.0.2"
profileInstaller = "1.4.1"
coroutines = "1.10.2"
serializationJson = "1.9.0"
junit = "4.13.2"

# GeckoView channel + exact build. `geckoview` (default channel) maps to the
# current stable Firefox release line. Pinned to the exact build for
# reproducibility — never use nightly in production (stable pin prevents
# connection-dropping ABI churn on device). Pinned to the latest stable from
# maven.mozilla.org on 2026-11-02 (verified: 159.0.20261022150525).
geckoviewVersion = "159.0.20261022150525"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-palette-ktx = { group = "androidx.palette", name = "palette-ktx", version.ref = "paletteKtx" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileInstaller" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version = "1.9.1" }
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
geckoview = { module = "org.mozilla.geckoview:geckoview", version.ref = "geckoviewVersion" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }